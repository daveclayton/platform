services:
  traefik:
    image: traefik:latest
    ports:
      - 80:80
      - 443:443
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_LOCATION}/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${DATA_LOCATION}/certs:/etc/certs
    networks:
      - traefik
    environment:
      CF_API_EMAIL: ${CLOUDFLARE_EMAIL}
      CF_DNS_API_TOKEN: ${CLOUDFLARE_TOKEN}
      CF_ZONE_API_TOKEN: ${CLOUDFLARE_TOKEN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.service=api@internal
      - traefik.http.routers.api.entrypoints=http,https,traefik

networks:
  traefik:
    external: true
