services:
  traefik:
    image: traefik:latest
    ports:
      - 80:80
      - 443:443
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_LOCATION}/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${DATA_LOCATION}/certs:/etc/certs
    networks:
      - traefik
    environment:
      CF_API_EMAIL: ${CLOUDFLARE_EMAIL}
      CF_DNS_API_TOKEN: ${CLOUDFLARE_TOKEN}
      CF_ZONE_API_TOKEN: ${CLOUDFLARE_TOKEN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.service=api@internal
      - traefik.http.routers.api.entrypoints=http,https,traefik

  whoami:
    image: traefik/whoami
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.rule=Host(`whoami.${BASE_DOMAIN}`)
      - traefik.http.routers.whoami.tls.certresolver=letsencrypt
      - traefik.http.routers.whoami.entrypoints=https
      - traefik.http.services.whoami.loadbalancer.server.port=80
      - traefik.http.services.whoami.loadbalancer.server.scheme=http
      - serverstransport.insecureskipverify=true

    networks:
      - traefik

networks:
  traefik:
    external: true
